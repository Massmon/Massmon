{{ define "main" }}
<div class="box">
  <div class="boxhead">{{ .Title }}</div>
  <div class="boxbody">
    {{ with .Params.subtitle }}<p class="muted">{{ . }}</p>{{ end }}
    {{ with .Content }}<div class="prose">{{ . }}</div>{{ end }}
    {{ range .RegularPages }}{{ partial "entry-row.html" . }}{{ else }}<p class="muted">Nothing here yet. Check back soon!</p>{{ end }}
  </div>
</div>
{{ end }}
